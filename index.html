<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>כרטיסיות ערבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #f4f4f5;
  --bg-soft:   #ebebed;
  --surface:   #fffefc;
  --surface-2: #ffffff;
  --border:    #e4e4e7;
  --border-2:  #d4d4d8;
  --text:      #18181b;
  --text-2:    #52525b;
  --muted:     #a1a1aa;
  --accent:    #4f46e5;
  --accent-2:  #6366f1;
  --accent-sf: #eef2ff;
  --emerald:   #059669;
  --amber:     #b45309;
  --rose:      #e11d48;
  --shadow-1:  0 1px 2px rgba(24,24,27,.04), 0 4px 12px rgba(24,24,27,.05), 0 16px 40px rgba(24,24,27,.06);
  --shadow-2:  0 2px 4px rgba(24,24,27,.05), 0 8px 20px rgba(24,24,27,.07), 0 24px 60px rgba(79,70,229,.10);
  --ease:      cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"] {
  --bg:        #0b0b0f;
  --bg-soft:   #131318;
  --surface:   #17171d;
  --surface-2: #1d1d25;
  --border:    #27272f;
  --border-2:  #35353f;
  --text:      #f4f4f5;
  --text-2:    #a1a1aa;
  --muted:     #6b6b76;
  --accent:    #818cf8;
  --accent-2:  #a5b4fc;
  --accent-sf: #1e1b3a;
  --emerald:   #34d399;
  --amber:     #fbbf24;
  --rose:      #fb7185;
  --shadow-1:  0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-2:  0 2px 6px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.4), 0 24px 60px rgba(129,140,248,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { overflow-x: hidden; max-width: 100vw; }

body {
  font-family: 'Heebo','Inter',system-ui,-apple-system,sans-serif;
  font-size: 16px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: env(safe-area-inset-top) calc(16px + env(safe-area-inset-right))
           calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  transition: background .3s var(--ease), color .3s var(--ease);
  -webkit-font-smoothing: antialiased;
}

button, .chip, .segmented button {
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ── progress ─────────────────────────────── */
.progress-track {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: var(--border); z-index: 50;
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .35s var(--ease);
}

/* ── header ───────────────────────────────── */
header {
  width: 100%; max-width: 520px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 2px 16px;
}
.brand { font-size: .95rem; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
.brand span { color: var(--muted); font-weight: 400; }

.icon-btn {
  width: 44px; height: 44px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); cursor: pointer; font-size: .95rem;
  display: grid; place-items: center;
  transition: all .18s var(--ease);
}
.icon-btn:hover  { border-color: var(--border-2); color: var(--text); }
.icon-btn:active { transform: translateY(2px); }

.google-btn {
  display: flex; align-items: center; gap: 7px;
  height: 44px; padding: 0 14px;
  border-radius: 8px; border: 1px solid #dadce0; background: #fff;
  color: #3c4043; font-family: 'Inter', 'Heebo', system-ui, sans-serif;
  font-size: .78rem; font-weight: 500; letter-spacing: 0; white-space: nowrap;
  cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  transition: all .18s var(--ease);
}
.google-btn:hover  { box-shadow: 0 1px 4px rgba(0,0,0,.18); border-color: #c6c9cc; }
.google-btn:active { transform: translateY(2px); }
.google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

.user-chip {
  display: flex; align-items: center; gap: 8px;
  height: 44px; max-width: 170px; padding: 0 14px 0 4px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: .78rem; font-weight: 500;
  cursor: pointer; transition: all .18s var(--ease);
}
.user-chip:hover  { border-color: var(--accent); }
.user-chip:active { transform: translateY(2px); }
.user-chip img {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
}
.user-chip span {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── controls ─────────────────────────────── */
.controls { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }

/* label sits beside the control, not above it — saves a row per filter */
.filter-row { display: flex; align-items: center; gap: 8px; }
.filter-row > .filter-label {
  flex: 0 0 52px; margin: 0; text-align: right;
  font-size: .66rem; line-height: 1.2; color: var(--muted);
}
.filter-row > .segmented { flex: 1; min-width: 0; }

/* collapsible filter panel — keeps the card near the top of the screen.
   Styled to invite clicking: accent gradient border + icon + live badge,
   not a plain gray bar — a "just a link" look tested as easy to overlook. */
.filter-toggle {
  position: relative;
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; min-height: 46px; padding: 9px 16px;
  border-radius: 13px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer;
  font-family: inherit; font-size: .78rem; font-weight: 600;
  box-shadow: 0 1px 2px rgba(24,24,27,.04);
  transition: all .2s var(--ease);
}
.filter-toggle:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 20%, transparent);
}
.filter-toggle:active { transform: translateY(2px); }
.filter-toggle.active {
  border-color: var(--accent);
  background: var(--accent-sf);
  color: var(--accent);
}
.filter-toggle .flabel { display: flex; align-items: center; gap: 8px; }
.filter-toggle .ficon { font-size: .95rem; }
.filter-toggle .fcount { color: var(--muted); font-weight: 400; font-size: .74rem; }
.filter-toggle.active .fcount { color: var(--accent); opacity: .85; }
.filter-toggle .fbadge {
  display: none; min-width: 19px; height: 19px; padding: 0 5px;
  border-radius: 999px; background: var(--accent); color: #fff;
  font-size: .66rem; font-weight: 700; line-height: 19px; text-align: center;
}
.filter-toggle.active .fbadge { display: inline-block; }
.filter-toggle .chev {
  transition: transform .22s var(--ease); font-size: .7rem; color: inherit; opacity: .6;
}
.filter-toggle.open .chev { transform: rotate(180deg); }
.filter-panel { display: none; flex-direction: column; gap: 7px; }
.filter-panel.open { display: flex; }

.search-box {
  width: 100%; height: 40px; padding: 0 14px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-family: inherit;
  font-size: 16px; /* must stay >=16px: prevents iOS auto-zoom on focus */
  transition: all .18s var(--ease);
}
.search-box::placeholder { color: var(--muted); }
.search-box:focus { outline: none; border-color: var(--accent); }

.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.chip {
  min-height: 38px;
  font-size: .67rem; font-weight: 500; line-height: 1.3;
  padding: 5px 5px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); cursor: pointer;
  text-align: center;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 0 4px;
  transition: all .18s var(--ease);
}
.chip:active { transform: translateY(2px); }
.chip.on {
  background: var(--accent-sf); border-color: var(--accent);
  color: var(--accent); font-weight: 600;
}
.chip-progress { font-size: .57rem; font-weight: 400; color: var(--muted); }
.chip.on .chip-progress { color: var(--accent); opacity: .75; }

.segmented {
  display: flex; padding: 2px; gap: 2px;
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 11px;
}
.segmented button {
  flex: 1; min-height: 36px; padding: 5px 4px; font-size: .72rem; font-weight: 500;
  font-family: inherit; border: none; border-radius: 9px; white-space: nowrap;
  background: transparent; color: var(--text-2); cursor: pointer;
  transition: all .2s var(--ease);
}
/* mode switcher stays the prominent one */
#modeSeg button { min-height: 42px; font-size: .82rem; }
.segmented button:active { transform: translateY(2px); }
.segmented button.on {
  background: var(--surface-2); color: var(--text);
  font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

/* ── card ─────────────────────────────────── */
.card-wrap {
  position: relative;
  perspective: 1600px;
  width: 100%; max-width: 520px; min-height: 340px;
  cursor: pointer; margin-bottom: 4px;
}
.card-inner {
  position: relative; width: 100%; min-height: 340px;
  transform-style: preserve-3d;
  transition: transform .6s var(--ease);
}
.card-wrap.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0; width: 100%; min-height: 340px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  padding: 46px 26px 52px;
  transition: box-shadow .28s var(--ease), border-color .28s var(--ease);
}
.card-wrap:hover .card-face {
  box-shadow: var(--shadow-2);
  border-color: var(--accent);
}
.card-back { transform: rotateY(180deg); }

.lesson-tag {
  position: absolute; top: 16px; right: 20px;
  font-size: .68rem; font-weight: 500; letter-spacing: .01em;
  color: var(--muted);
}
.badge {
  position: absolute; top: 15px; left: 20px;
  font-size: .62rem; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--emerald) 12%, transparent);
  color: var(--emerald);
}
.hint {
  position: absolute; bottom: 17px; left: 0; right: 0;
  text-align: center; font-size: .7rem; color: var(--muted);
  opacity: .8;
}
.know-row {
  width: 100%; max-width: 520px;
  display: flex; justify-content: center; gap: 8px; margin-top: 14px;
}
.know-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 12px 20px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); cursor: pointer;
  font-family: inherit; font-size: .82rem; font-weight: 500;
  transition: all .18s var(--ease);
}
.know-btn:active { transform: translateY(2px); }
.know-btn .chk { font-size: .9rem; line-height: 1; }

.know-btn.partial:hover { border-color: var(--amber); color: var(--amber); }
.know-btn.partial.on {
  background: var(--amber); border-color: var(--amber);
  color: #fff; font-weight: 600;
  box-shadow: 0 1px 2px rgba(180,83,9,.25), 0 6px 16px rgba(180,83,9,.25);
}
.know-btn.good:hover { border-color: var(--emerald); color: var(--emerald); }
.know-btn.good.on {
  background: var(--emerald); border-color: var(--emerald);
  color: #fff; font-weight: 600;
  box-shadow: 0 1px 2px rgba(5,150,105,.25), 0 6px 16px rgba(5,150,105,.25);
}

.transliteration {
  font-size: clamp(1.75rem, 7vw, 2.6rem); font-weight: 600;
  letter-spacing: -.02em; line-height: 1.25;
  color: var(--text); text-align: center;
}
.arabic-script {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: clamp(1.1rem, 4.4vw, 1.55rem); font-weight: 400;
  direction: rtl; line-height: 2; color: var(--text-2); text-align: center;
}
.hebrew-text {
  font-size: clamp(1.45rem, 6vw, 2.1rem); font-weight: 500;
  letter-spacing: -.015em; line-height: 1.45;
  color: var(--text); text-align: center;
}
.note {
  margin-top: 4px; max-width: 90%;
  font-size: .78rem; font-weight: 300; line-height: 1.6;
  color: var(--muted); text-align: center;
  padding-top: 12px; border-top: 1px solid var(--border);
}

/* speaker pinned to the card's bottom-left corner (like .lesson-tag/.badge
   above) — not inline with the text, not centered under it */
.sound-btn {
  position: absolute; bottom: 16px; left: 20px;
  width: 44px; height: 44px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); cursor: pointer; font-size: 1.05rem;
  display: grid; place-items: center;
  transition: all .18s var(--ease);
}
.sound-btn:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-sf); }
.sound-btn:active { transform: translateY(2px); }

/* Which voice is this? A real recording of the teacher vs a synthetic
   approximation are genuinely different things — synthesis cannot produce the
   dialect vowels (ē/ō) or a word-final -e at all. The learner should be able
   to tell, rather than assume every card is the teacher's own pronunciation. */
.voice-tag {
  display: inline-block; margin-top: 10px;
  /* the pair layout is a grid, so a bare inline-block stretches to the full
     column width and reads as a bar rather than a tag — keep it self-sized
     and centred in both card types */
  justify-self: center; align-self: center; width: fit-content;
  font-size: .68rem; font-weight: 600; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 999px; border: 1px solid transparent;
}
.voice-real {
  color: var(--accent); background: var(--accent-sf); border-color: var(--accent);
}
.voice-tts {
  color: var(--muted); background: var(--surface-2); border-color: var(--border);
}

/* gender pair */
.gender-pair { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.gender-row  { display: flex; align-items: center; gap: 12px; padding: 8px 2px; }
.gender-label {
  font-size: .62rem; font-weight: 600; letter-spacing: .04em;
  color: var(--muted); min-width: 40px; text-align: center; flex-shrink: 0;
  padding: 3px 0; border-radius: 6px; background: var(--bg-soft);
}
.word-block { flex: 1; text-align: center; min-width: 0; }
.word-block .transliteration { font-size: clamp(1.35rem, 5.4vw, 1.95rem); }
.word-block .arabic-script  { font-size: clamp(.95rem, 3.6vw, 1.25rem); line-height: 1.85; }
.gender-divider { height: 1px; background: var(--border); margin: 2px 8px; }
.sound-btn-sm {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); cursor: pointer; font-size: .9rem;
  display: grid; place-items: center;
  transition: all .18s var(--ease);
}
.sound-btn-sm:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-sf); }
.sound-btn-sm:active { transform: translateY(2px); }

/* ── nav ──────────────────────────────────── */
.nav-row {
  width: 100%; max-width: 520px;
  display: flex; gap: 8px; margin-top: 18px;
}
.nav-btn {
  flex: 1; padding: 13px 10px;
  font-family: inherit; font-size: .88rem; font-weight: 500;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  transition: all .18s var(--ease);
}
.nav-btn:hover  { border-color: var(--border-2); color: var(--text); }
.nav-btn:active { transform: translateY(2px); }
.nav-btn.primary {
  flex: 1.4;
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  box-shadow: 0 1px 2px rgba(79,70,229,.2), 0 6px 16px rgba(79,70,229,.22);
}
.nav-btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

.counter {
  margin-top: 14px; font-size: .74rem; font-weight: 400;
  color: var(--muted); letter-spacing: .02em;
}
.status { margin-top: 8px; font-size: .7rem; color: var(--muted); min-height: 1em; }

.empty { color: var(--muted); font-size: .9rem; text-align: center; }

.filter-label { font-size: .7rem; color: var(--muted); margin: 2px 2px -2px; }

/* ── tip button ───────────────────────────── */
.tip-wrap {
  position: relative; width: 100%; max-width: 520px; margin-top: 22px;
  padding: 3px; /* gap for the border light — the button must NOT fill the
                   whole wrap, or its own background paints over the SVG
                   stroke sitting right behind its edges */
}
/* Light literally travels along the button's own outline (an SVG stroke on
   a rect matching its exact rounded-rect shape via JS, see sizeTipBorder())
   — NOT a rotating conic-gradient disc, which sweeps by angle around the
   center and looks like a spinning pinwheel on a non-circular shape instead
   of tracing the border. */
.tip-border {
  position: absolute; inset: 0; width: 100%; height: 100%;
  overflow: visible; pointer-events: none;
  animation: tip-fade 5s ease-out 1 forwards;
}
#tipBorderRect {
  fill: none; stroke: url(#tipGrad); stroke-width: 2.5; stroke-linecap: round;
  filter: drop-shadow(0 0 3px rgba(129,140,248,.9));
  animation: tip-chase 5s linear 1 forwards;
}
@keyframes tip-chase { to { stroke-dashoffset: var(--tip-dash-end, 0); } }
/* one-time flourish, not a permanent loop — the light chases the border for
   5s total then fades to nothing, so it doesn't keep drawing the eye during
   a long study session (explicit "not intrusive" ask) */
@keyframes tip-fade {
  0%   { opacity: 1; }
  80%  { opacity: 1; }
  100% { opacity: 0; }
}
.tip-btn {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; padding: 12px 20px; border-radius: 17px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  font-weight: 700; font-size: .88rem; text-decoration: none;
  transition: transform .18s var(--ease), background .18s var(--ease);
}
.tip-btn:hover  { background: var(--surface-2); }
.tip-btn:active { transform: translateY(2px); }

.tip-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.5);
  align-items: center; justify-content: center; padding: 20px;
}
.tip-overlay.open { display: flex; }
.tip-modal {
  width: 100%; max-width: 360px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 30px 24px 22px; text-align: center; box-shadow: var(--shadow-2);
}
.tip-modal-emoji { font-size: 2.1rem; margin-bottom: 12px; }
.tip-modal-text {
  font-size: .88rem; line-height: 1.75; color: var(--text-2); margin-bottom: 22px;
}
.tip-modal-go {
  display: block; width: 100%; min-height: 48px; line-height: 48px;
  border-radius: 12px; background: var(--accent); color: #fff;
  font-weight: 700; font-size: .88rem; text-decoration: none; margin-bottom: 8px;
  transition: all .18s var(--ease);
}
.tip-modal-go:hover  { background: var(--accent-2); }
.tip-modal-go:active { transform: translateY(2px); }
.tip-modal-close {
  border: none; background: transparent; color: var(--muted);
  font-family: inherit; font-size: .8rem; cursor: pointer;
  padding: 10px; min-height: 44px; width: 100%;
}

.credit {
  margin-top: 26px; font-size: .72rem; color: var(--muted);
  text-align: center;
}
.credit a {
  color: var(--muted); text-decoration: underline; text-underline-offset: 2px;
  transition: color .18s var(--ease);
}
.credit a:hover { color: var(--accent); }

/* ── games ────────────────────────────────── */
.game-wrap { width: 100%; max-width: 520px; }
.game-msg {
  padding: 40px 20px; text-align: center;
  color: var(--muted); font-size: .9rem; line-height: 1.7;
}
.game-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; font-size: .78rem; color: var(--text-2);
}
.streak-big { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
.streak-best { font-size: .72rem; color: var(--muted); }

/* matching */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match-item {
  min-height: 56px; padding: 10px 8px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-align: center; line-height: 1.3;
  transition: all .18s var(--ease);
}
.match-item:active { transform: translateY(2px); }
.match-item .m-main { font-size: .88rem; font-weight: 600; }
.match-item .m-sub  {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: .78rem; color: var(--text-2); direction: rtl;
}
.match-item.sel {
  border-color: var(--accent); background: var(--accent-sf);
  color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.match-item.ok {
  border-color: var(--emerald); background: color-mix(in srgb, var(--emerald) 14%, transparent);
  color: var(--emerald); pointer-events: none; opacity: .65;
}
.match-item.bad {
  border-color: var(--rose); background: color-mix(in srgb, var(--rose) 14%, transparent);
  color: var(--rose); animation: shake .32s var(--ease);
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* quiz */
.quiz-q {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: var(--shadow-1);
  padding: 28px 20px; margin-bottom: 12px; text-align: center;
}
.quiz-q .q-main { font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 600; letter-spacing: -.02em; }
.quiz-q .q-sub  {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: clamp(1rem, 4vw, 1.35rem); color: var(--text-2);
  direction: rtl; line-height: 2; margin-top: 4px;
}
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  min-height: 52px; padding: 12px 16px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer; font-family: inherit;
  font-size: .92rem; font-weight: 500; text-align: center;
  transition: all .18s var(--ease);
}
.quiz-opt:active { transform: translateY(2px); }
.quiz-opt.ok {
  border-color: var(--emerald); background: color-mix(in srgb, var(--emerald) 16%, transparent);
  color: var(--emerald); font-weight: 700;
}
.quiz-opt.bad {
  border-color: var(--rose); background: color-mix(in srgb, var(--rose) 14%, transparent);
  color: var(--rose); animation: shake .32s var(--ease);
}
.quiz-opts.locked .quiz-opt { pointer-events: none; }

.confetti-piece {
  position: fixed; top: 0; left: 0; width: 8px; height: 8px; border-radius: 2px;
  pointer-events: none; z-index: 999;
  animation: confetti-rise 950ms ease-out forwards;
}
@keyframes confetti-rise {
  0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--dx, 0px), -300px) rotate(560deg); opacity: 0; }
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('fc-theme', t); } catch (e) {}
  document.querySelector('meta[name=theme-color]').setAttribute(
    'content', t === 'dark' ? '#0b0b0f' : '#f4f4f5');
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

function openTipModal()  { document.getElementById('tipOverlay').classList.add('open'); }
function closeTipModal() { document.getElementById('tipOverlay').classList.remove('open'); }

/* Sizes the tip button's border-tracing SVG to the button's exact pixel box
   (not a fixed viewBox — the button's width is responsive) and computes the
   real outline length via getTotalLength(), so the traveling dash hugs the
   actual rounded-rect path instead of guessing a perimeter. */
function sizeTipBorder() {
  const wrap = document.getElementById('tipWrap');
  const svg = document.getElementById('tipBorderSvg');
  const rect = document.getElementById('tipBorderRect');
  if (!wrap || !svg || !rect) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const sw = 2.5, r = 16;
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  rect.setAttribute('x', sw / 2);
  rect.setAttribute('y', sw / 2);
  rect.setAttribute('width', Math.max(w - sw, 1));
  rect.setAttribute('height', Math.max(h - sw, 1));
  rect.setAttribute('rx', r);
  rect.setAttribute('ry', r);
  const len = rect.getTotalLength();
  const dash = len * 0.16; /* bright segment ≈ 16% of the outline */
  rect.style.strokeDasharray = dash + ' ' + (len - dash);
  rect.style.strokeDashoffset = '0';
  rect.style.setProperty('--tip-dash-end', -(len * 3)); /* 3 loops in 5s */
}
window.addEventListener('resize', sizeTipBorder);
(function () {
  let t = null;
  try { t = localStorage.getItem('fc-theme'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(t);
})();

/* ── CSV parsing ──────────────────────────── */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', q = false;
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return c.trim(); }); });
}

/* Counts real words: tokens holding at least one Hebrew or Arabic letter, so
   stray punctuation ("-", "/") and empty splits don't inflate the count. */
/* Strips Hebrew niqqud and Arabic tashkeel (including the teacher's own
   tsere/cholam marks, which fall in the same Unicode range) so search
   matches with or without diacritics typed on either side. */
function stripDiacritics(s) {
  return String(s).replace(/[\u0591-\u05C7\u064B-\u0670\u06D6-\u06ED]/g, '');
}

function phraseWordCount(s) {
  if (!s) return 0;
  return String(s).split(/[\s\u00A0]+/).filter(function (t) {
    return /[\u0590-\u05FF\u0600-\u06FF]/.test(t);
  }).length;
}

function rowsToCards(rows) {
  if (!rows.length) return [];
  const head = rows[0].map(function (h) { return h.replace(/^\uFEFF/, '').trim(); });
  const col = {};
  head.forEach(function (h, i) { col[h] = i; });
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const g = function (name) { const i = col[name]; return i === undefined ? '' : (rows[r][i] || '').trim(); };
    const tr = g('תעתיק'), he = g('תרגום'), ar = g('ערבית');
    if (!tr && !ar) continue;
    const said = g('נאמר_בשיעור') === 'כן';
    const note = g('הערות');
    const lesson = g('שיעור');
    const topic = g('נושא');
    const isPair = (tr.split('/').length - 1) === 1 && (ar.split('/').length - 1) === 1;
    const id = lesson + '|' + tr;
    /* `ערבית_להשמעה` is OPTIONAL and only for TTS. The teacher's tsere/cholam
       marks (ARABIC SUBSCRIPT ALEF / ARABIC INVERTED DAMMA — a notation they
       defined themselves, not standard tashkeel) are correct for reading but
       no speech engine on earth was trained to interpret them, since it's a
       convention invented by these specific teachers. `ערבית` stays what's
       DISPLAYED (with the correct dialectal marks); this column, when
       present, is what's SPOKEN instead — the closest standard-tashkeel
       approximation. Empty column = speak the same text as displayed
       (today's behavior, unchanged for every existing row). */
    const arSpeak = g('ערבית_להשמעה');
    /* `ערבית_IPA` is OPTIONAL. When present it states the pronunciation
       directly (see speakText) rather than relying on the engine's reading of
       the Arabic. Follows the same X/Y slash convention as every other column
       for gender pairs; if it doesn't split into exactly 2, each side falls
       back to no IPA and speaks its written form as before. */
    const arIPA = g('ערבית_IPA');
    /* `אודיו` = id of a REAL RECORDING of the teacher saying this word, cut
       from the course lesson audio. When present it is played instead of any
       synthesis — no engine can match a native speaker, and every one of the
       teacher's pronunciation complaints simply doesn't arise for these.
       Empty for words with no usable recording; those fall back to TTS and
       are marked as such in the UI so a learner always knows which they're
       hearing. Gender pairs share one clip (the sheet records one per row).

       Value is "<lesson>/<row>", e.g. "L21/408" -> L21/408.m4a, served from
       the repo ROOT. Clips are foldered by lesson rather than dumped flat:
       519 files in one folder is unmanageable to upload, review or re-cut,
       and a lesson is the unit everything else here is organised by.
       They sit at the root rather than under audio/ because GitHub's web
       uploader drops dragged folders at the root -- matching that is more
       robust than relying on the path field being filled in correctly. */
    const arAudio = g('אודיו');
    /* `סוג_זוג` says what an X/Y row actually contrasts. The app used to call
       every slashed row masculine/feminine, which is wrong for singular/plural
       (عِيد/أَعْيَاد), past/present (اِشْتَاق/يِشْتَاق) and plain synonyms
       (عَيَّان/مَرِيض) -- it taught incorrect grammar on ~78 of 126 cards.
       Empty falls back to gender, i.e. the old behaviour. */
    const pairKind = g('סוג_זוג') || 'מין';
    /* Length of the phrase being learned (the Arabic side, via its
       transliteration) — not the Hebrew gloss: עִנְדִי is one word to learn
       even though "יש לי" is two. Gender pairs count one form only.
       Computed, never stored — a hand-typed count silently goes stale the
       moment a word is edited. The optional `מילים` column exists only to
       override the handful of cases where the automatic count is arguable
       (e.g. חַרְף - חֻרוּף, one word shown in singular+plural). */
    const override = parseInt(g('מילים'), 10);
    const words = override > 0 ? override
                : phraseWordCount(isPair ? tr.split('/')[0] : tr);
    if (isPair) {
      const t = tr.split('/'), a = ar.split('/');
      const aSpeak = (arSpeak.split('/').length - 1) === 1 ? arSpeak.split('/') : a;
      const aIPA = (arIPA.split('/').length - 1) === 1 ? arIPA.split('/') : ['', ''];
      out.push({ id: id, isGenderPair: true, pairKind: pairKind, arM: t[0].trim(), arF: t[1].trim(),
                 arabicM: a[0].trim(), arabicF: a[1].trim(),
                 arabicMSpeak: (aSpeak[0] || a[0]).trim(), arabicFSpeak: (aSpeak[1] || a[1]).trim(),
                 arabicMIPA: (aIPA[0] || '').trim(), arabicFIPA: (aIPA[1] || '').trim(),
                 audio: arAudio,
                 he: he, note: note, said: said, lesson: lesson, topic: topic, words: words });
    } else {
      out.push({ id: id, isGenderPair: false, ar: tr, arabic: ar,
                 arabicSpeak: arSpeak || ar, arabicIPA: arIPA, audio: arAudio,
                 he: he, note: note, said: said, lesson: lesson, topic: topic, words: words });
    }
  }
  return out;
}

/* ── speech ───────────────────────────────── */
/* Primary path: Azure Levantine-Arabic voices, via the /speak proxy function
   (the Azure key lives server-side only, see netlify/functions/speak.js).
   Fallback: the browser's own MSA voice — used whenever the proxy isn't
   reachable (not deployed yet, offline, monthly quota hit, or local file://
   testing where Netlify Functions don't exist) so a card is never silent. */
let currentAudio = null;

async function speakText(text, ipa, audioId) {
  if (!text && !audioId) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  speechSynthesis.cancel();

  /* A real recording of the teacher always wins over synthesis. If the file
     is missing (not yet deployed, bad id) fall through to TTS rather than
     leaving the card silent. */
  if (audioId) {
    try {
      const a = new Audio(audioId + '.m4a');
      currentAudio = a;
      await a.play();
      return;
    } catch (e) { /* fall through to synthesis */ }
  }

  try {
    /* `ipa`, when the sheet supplies it, states the SOUNDS outright instead of
       leaving the engine to read Arabic spelling. Arabic script cannot write
       the spoken Levantine ē/ō (the reason the teachers invented their own
       marks), so respelling could only ever approximate them. Verified
       2026-08-25: Azure honours <phoneme> for Arabic and ignores the written
       text entirely when it's present. Omitted -> unchanged behaviour. */
    const payload = { text: text };
    if (ipa) payload.ipa = ipa;
    const res = await fetch('/.netlify/functions/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('tts proxy ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    audio.addEventListener('ended', function () { URL.revokeObjectURL(url); });
    await audio.play();
  } catch (e) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-SA'; u.rate = 0.8;
    speechSynthesis.speak(u);
  }
}

/* ── rendering ────────────────────────────── */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Tell the learner WHICH voice they're about to hear. A real recording of the
   teacher and a synthetic approximation are not the same thing, and the
   difference matters most exactly where synthesis is weakest (the dialect
   vowels ē/ō, word-final -e). Hiding that would quietly present a machine
   guess as the teacher's own pronunciation. */
function speakerIcon(c) {
  return c.audio ? '🔊' : '🔉';
}
function voiceBadge(c) {
  return c.audio
    ? '<span class="voice-tag voice-real" title="הקלטה של המורה">הקלטה</span>'
    : '<span class="voice-tag voice-tts" title="הגייה ממוחשבת — לא הוקלט">ממוחשב</span>';
}

const PAIR_LABELS = {
  'מין':    ['זכר', 'נקבה'],
  'מספר':   ['יחיד', 'רבים'],
  'זמן':    ['עבר', 'הווה'],
  'נרדפות': ['', ''],        /* alternatives, not a grammatical contrast */
};

function genderHTML(c) {
  const lbl = PAIR_LABELS[c.pairKind] || PAIR_LABELS['מין'];
  function rowHTML(label, tr, ab, speakKey, ipaKey) {
    return '<div class="gender-row">' +
      '<span class="gender-label">' + label + '</span>' +
      '<div class="word-block">' +
        '<div class="transliteration">' + esc(tr) + '</div>' +
        '<div class="arabic-script">' + esc(ab) + '</div>' +
      '</div>' +
      '<button class="sound-btn-sm" aria-label="השמעה" ' +
        'onclick="event.stopPropagation();speakText(deck[idx].' + speakKey +
        ', deck[idx].' + ipaKey + ', deck[idx].audio)">' + speakerIcon(c) + '</button>' +
    '</div>';
  }
  return '<div class="gender-pair">' +
    rowHTML(lbl[0], c.arM, c.arabicM, 'arabicMSpeak', 'arabicMIPA') +
    '<div class="gender-divider"></div>' +
    rowHTML(lbl[1], c.arF, c.arabicF, 'arabicFSpeak', 'arabicFIPA') +
    /* the badge belongs on pair cards too -- it was only on single-word cards,
       so half the deck gave the learner no idea which voice they were hearing.
       One badge for the card: the sheet stores one recording per row, shared
       by both forms. */
    voiceBadge(c) +
  '</div>';
}

function arabicHTML(c) {
  return '<div class="transliteration">' + esc(c.ar) + '</div>' +
         '<div class="arabic-script">' + esc(c.arabic) + '</div>' +
         voiceBadge(c) +
         '<button class="sound-btn" aria-label="השמעה" ' +
           'onclick="event.stopPropagation();speakText(deck[idx].arabicSpeak, ' +
           'deck[idx].arabicIPA, deck[idx].audio)">' + speakerIcon(c) + '</button>';
}

function hebrewHTML(c) {
  return '<div class="hebrew-text">' + esc(c.he) + '</div>' +
         (c.note ? '<div class="note">' + esc(c.note) + '</div>' : '');
}

/* Sizes the flip-card box to whichever face (front/back) is actually
   taller. Long gender-pair phrases can wrap differently once the Arabic
   web font ('Noto Naskh Arabic', loaded with display=swap) finishes
   downloading and swaps in over the fallback serif — if that swap happens
   AFTER this measurement, the box stays locked to the shorter fallback
   layout and text spills past the card border. document.fonts.ready (see
   boot()) re-runs this once the real font is active, so the box always
   ends up sized to the font that's actually on screen. */
function syncCardHeight() {
  if (!document.getElementById('cardInner')) return;
  ['cardInner', 'cardWrap'].forEach(function (id) {
    document.getElementById(id).style.minHeight = '';
  });
  document.querySelectorAll('.card-face').forEach(function (f) { f.style.minHeight = ''; });
  const h = Math.max(
    document.getElementById('cardFront').scrollHeight,
    document.getElementById('cardBack').scrollHeight, 340) + 'px';
  document.getElementById('cardInner').style.minHeight = h;
  document.getElementById('cardWrap').style.minHeight = h;
  document.querySelectorAll('.card-face').forEach(function (f) { f.style.minHeight = h; });
}

function show() {
  const fc = document.getElementById('frontContent');
  const bc = document.getElementById('backContent');
  const wrap = document.getElementById('cardWrap');
  wrap.classList.remove('flipped');

  if (!deck.length) {
    document.getElementById('lessonTag').textContent = '';
    document.getElementById('badgeEl').style.display = 'none';
    fc.innerHTML = '<div class="empty">אין כרטיסיות בסינון הנוכחי</div>';
    bc.innerHTML = '';
    document.getElementById('counter').textContent = '0 / 0';
    document.getElementById('progressFill').style.width = '0%';
    return;
  }

  const c = deck[idx];
  document.getElementById('lessonTag').textContent = lessonName(c.lesson);
  document.getElementById('badgeEl').style.display = c.said ? '' : 'none';
  const lvl = levelMap[c.id];
  const kp = document.getElementById('knowPartial');
  const kg = document.getElementById('knowGood');
  kp.classList.toggle('on', lvl === 'partial');
  kg.classList.toggle('on', lvl === 'good');
  kg.querySelector('.chk').textContent = lvl === 'good' ? '🎉' : '✓';

  const arSide = c.isGenderPair ? genderHTML(c) : arabicHTML(c);
  if (dir === 'ah') { fc.innerHTML = arSide;      bc.innerHTML = hebrewHTML(c); }
  else              { fc.innerHTML = hebrewHTML(c); bc.innerHTML = arSide; }

  requestAnimationFrame(syncCardHeight);

  document.getElementById('counter').textContent = (idx + 1) + ' / ' + deck.length;
  document.getElementById('progressFill').style.width =
    ((idx + 1) / deck.length * 100).toFixed(1) + '%';
}

function flip()  { document.getElementById('cardWrap').classList.toggle('flipped'); }
function move(n) { if (!deck.length) return; idx = (idx + n + deck.length) % deck.length; show(); }

function playSparkle() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [1400, 1760, 2093, 2637].forEach(function (freq, i) {
      const t = ctx.currentTime + i * 0.045;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.1, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    });
    setTimeout(function () { ctx.close(); }, 500);
  } catch (e) {}
}

function burstConfetti(x, y) {
  const colors = ['#4f46e5', '#6366f1', '#059669', '#e11d48', '#f59e0b'];
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('span');
    el.className = 'confetti-piece';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = (Math.random() * 100) + 'ms';
    el.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1300);
  }
}

/* Set (or toggle off) the memory level of the current card.
   Deliberately does NOT advance — navigation stays a separate action. */
async function setLevel(level) {
  if (!deck.length || typeof saveLevel !== 'function') return;
  const id = deck[idx].id;
  const next = levelMap[id] === level ? null : level;
  const applied = await saveLevel(id, next);
  if (applied === 'good') {
    const rect = document.getElementById('knowGood').getBoundingClientRect();
    burstConfetti(rect.left + rect.width / 2, rect.top);
    playSparkle();
  }
  updateChipProgress();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }
}

/* user-facing "ערבב" button: new order AND jump to a new card */
function shuffle() { shuffleDeck(); idx = 0; show(); }

function setDir(d) {
  dir = d;
  document.getElementById('btnAH').classList.toggle('on', d === 'ah');
  document.getElementById('btnHA').classList.toggle('on', d === 'ha');
  show();
  if (mode === 'match') startMatch();
  else if (mode === 'quiz') nextQuiz();
}

function lessonProgress(ls) {
  let total = 0, good = 0;
  ALL.forEach(function (c) {
    if (c.lesson !== ls) return;
    total++;
    if (levelMap[c.id] === 'good') good++;
  });
  return good + '/' + total;
}

/* Refresh just the X/Y badges — levelMap changes after sign-in and on every
   level toggle, but the chips themselves don't need rebuilding. */
function updateChipProgress() {
  document.querySelectorAll('#chips .chip').forEach(function (el) {
    const p = el.querySelector('.chip-progress');
    if (p) p.textContent = lessonProgress(el.dataset.lesson);
  });
}

function renderChips() {
  const box = document.getElementById('chips');
  box.innerHTML = '';
  lessons.forEach(function (ls) {
    const el = document.createElement('label');
    el.className = 'chip on';
    el.dataset.lesson = ls;
    const name = document.createElement('span');
    name.textContent = lessonName(ls);
    const prog = document.createElement('span');
    prog.className = 'chip-progress';
    prog.textContent = lessonProgress(ls);
    el.appendChild(name);
    el.appendChild(prog);
    el.onclick = function () {
      if (enabled.has(ls)) { enabled.delete(ls); el.classList.remove('on'); }
      else { enabled.add(ls); el.classList.add('on'); }
      rebuild();
    };
    box.appendChild(el);
  });
}

function setSaidFilter(v) {
  saidFilter = v;
  document.querySelectorAll('#saidSeg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  rebuild();
}

function setKnownFilter(v) {
  knownFilter = v;
  document.querySelectorAll('#knownSeg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  rebuild();
}

function setWordsFilter(v) {
  wordsFilter = v;
  document.querySelectorAll('#wordsSeg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  rebuild();
}

function toggleFilters() {
  const open = !document.getElementById('filterPanel').classList.contains('open');
  document.getElementById('filterPanel').classList.toggle('open', open);
  document.getElementById('filterToggle').classList.toggle('open', open);
  try { localStorage.setItem('fc-filters', open ? '1' : '0'); } catch (e) {}
}

/* Collapsed filters must still tell you what's active, or you can't tell why
   words are missing from the deck. */
function updateFilterSummary() {
  const bits = [];
  if (lessons.length && enabled.size !== lessons.length) bits.push(enabled.size + ' שיעורים');
  if (saidFilter === 'said') bits.push('נאמרו');
  if (saidFilter === 'not')  bits.push('לא נאמרו');
  if (knownFilter === 'none')    bits.push('לא זוכר');
  if (knownFilter === 'partial') bits.push('בערך');
  if (knownFilter === 'good')    bits.push('זוכר טוב');
  if (wordsFilter === '1')     bits.push('מילה אחת');
  if (wordsFilter === '2')     bits.push('2 מילים');
  if (wordsFilter === '3plus') bits.push('3+ מילים');
  const q = (document.getElementById('searchBox').value || '').trim();
  if (q) bits.push('חיפוש "' + q + '"');

  const toggle = document.getElementById('filterToggle');
  toggle.classList.toggle('active', bits.length > 0);
  toggle.title = bits.length ? bits.join(', ') : '';
  document.getElementById('filterBadge').textContent = bits.length || '';
  document.getElementById('filterSummary').textContent = deck.length + ' מילים';
}

/* Recompute the deck after a data load or filter change.
   Keeps the card the user is currently looking at on screen — boot runs this
   3x (fallback / sheet / auth) and the word must NOT jump around. */
function rebuild() {
  const current = deck[idx];
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  deck = ALL.filter(function (c) {
    if (!enabled.has(c.lesson)) return false;
    if (saidFilter === 'said' && !c.said) return false;
    if (saidFilter === 'not'  && c.said) return false;
    const lvl = levelMap[c.id] || 'none';
    if (knownFilter !== 'all' && lvl !== knownFilter) return false;
    if (wordsFilter === '1'     && c.words !== 1) return false;
    if (wordsFilter === '2'     && c.words !== 2) return false;
    if (wordsFilter === '3plus' && c.words < 3)   return false;
    if (q) {
      const hay = [c.ar, c.arM, c.arF, c.arabic, c.arabicM, c.arabicF,
                   c.arabicSpeak, c.arabicMSpeak, c.arabicFSpeak, c.he, c.note]
        .filter(Boolean).join(' ').toLowerCase();
      /* Search ignores niqqud/tashkeel on both sides, so "ענדי" finds
         "עִנְדִי" and "عندي" finds "عِنْدِي" — typing the marks should never
         be required to find a word. */
      if (stripDiacritics(hay).indexOf(stripDiacritics(q)) === -1) return false;
    }
    return true;
  });
  shuffleDeck();
  let pos = -1;
  if (current) {
    for (let i = 0; i < deck.length; i++) {
      if (deck[i].id === current.id) { pos = i; break; }
    }
  }
  idx = pos > -1 ? pos : 0;
  show();
  updateFilterSummary();
  /* the word pool changed — restart whichever game is on screen */
  if (mode === 'match') startMatch();
  else if (mode === 'quiz') nextQuiz();
}

/* ── games ────────────────────────────────── */
/* Gender-pair cards use the masculine form as their single prompt. */
function promptMain(c) { return c.isGenderPair ? c.arM : c.ar; }
function promptSub(c)  { return c.isGenderPair ? c.arabicM : c.arabic; }

/* Games follow the same direction toggle as the flashcards. */
function qText(c) { return dir === 'ah' ? promptMain(c) : c.he; }
function qSub(c)  { return dir === 'ah' ? promptSub(c)  : ''; }
function aText(c) { return dir === 'ah' ? c.he : promptMain(c); }
function aSub(c)  { return dir === 'ah' ? ''   : promptSub(c); }

/* Distinct answer texts only — two cards meaning the same thing would make a
   match ambiguous and a quiz unanswerable. */
function uniquePool() {
  const seen = {}, out = [];
  deck.forEach(function (c) {
    const k = aText(c), p = qText(c);
    if (!k || !p || seen[k]) return;
    seen[k] = 1; out.push(c);
  });
  return out;
}

function pickRandom(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a.slice(0, n);
}

/* Distractors should come from the same lesson as the answer — unrelated
   words make the question guessable without knowing the word. Tops up from
   the wider pool only if that lesson can't supply enough. */
function distractors(pool, correct, n) {
  const same = pool.filter(function (c) {
    return c.lesson === correct.lesson && c.id !== correct.id;
  });
  let picked = pickRandom(same, n);
  if (picked.length < n) {
    const ids = {};
    picked.forEach(function (c) { ids[c.id] = 1; });
    const rest = pool.filter(function (c) { return c.id !== correct.id && !ids[c.id]; });
    picked = picked.concat(pickRandom(rest, n - picked.length));
  }
  return picked;
}

/* A matching round should also be one coherent lesson where possible. */
function pickMatchSet(pool, n) {
  const byLesson = {};
  pool.forEach(function (c) {
    (byLesson[c.lesson] = byLesson[c.lesson] || []).push(c);
  });
  const eligible = Object.keys(byLesson).filter(function (k) {
    return byLesson[k].length >= n;
  });
  if (!eligible.length) return pickRandom(pool, n);
  const lesson = pickRandom(eligible, 1)[0];
  return pickRandom(byLesson[lesson], n);
}

function gameMsg(el, txt) {
  el.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'game-msg';
  d.textContent = txt;
  el.appendChild(d);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeSeg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.m === m);
  });
  document.getElementById('modeCards').style.display = m === 'cards' ? '' : 'none';
  document.getElementById('modeMatch').style.display = m === 'match' ? '' : 'none';
  document.getElementById('modeQuiz').style.display  = m === 'quiz'  ? '' : 'none';
  if (m === 'cards') show();
  if (m === 'match') startMatch();
  if (m === 'quiz')  { streak = 0; updateStreak(); nextQuiz(); }
}

/* ── matching game ───────────────────────── */
function makeMatchItem(c, side) {
  const b = document.createElement('button');
  b.className = 'match-item';
  b.__card = c; b.__side = side;
  const main = document.createElement('span');
  main.className = 'm-main';
  main.textContent = side === 'q' ? qText(c) : aText(c);
  b.appendChild(main);
  const subTxt = side === 'q' ? qSub(c) : aSub(c);
  if (subTxt) {
    const sub = document.createElement('span');
    sub.className = 'm-sub';
    sub.textContent = subTxt;
    b.appendChild(sub);
  }
  b.onclick = function () { matchTap(b); };
  return b;
}

function updateMatchScore() {
  const topic = matchLesson ? lessonName(matchLesson) + '  ·  ' : '';
  document.getElementById('matchScore').textContent =
    topic + matchDone + '/' + MATCH_N + ' הותאמו' + (matchRounds ? '  ·  סבבים: ' + matchRounds : '');
}

function startMatch() {
  const body = document.getElementById('matchBody');
  matchSel = null; matchDone = 0;
  const pool = uniquePool();
  if (pool.length < MATCH_N) {
    gameMsg(body, 'צריך לפחות ' + MATCH_N + ' מילים בסינון הנוכחי כדי לשחק. בחרו עוד שיעורים או נקו את החיפוש.');
    document.getElementById('matchScore').textContent = '';
    return;
  }
  const five = pickMatchSet(pool, MATCH_N);
  matchLesson = five[0] ? five[0].lesson : '';
  const grid = document.createElement('div');
  grid.className = 'match-grid';
  const qs = pickRandom(five, MATCH_N);
  const as = pickRandom(five, MATCH_N);
  for (let i = 0; i < MATCH_N; i++) {
    grid.appendChild(makeMatchItem(qs[i], 'q'));
    grid.appendChild(makeMatchItem(as[i], 'a'));
  }
  body.innerHTML = '';
  body.appendChild(grid);
  updateMatchScore();
}

function matchTap(el) {
  if (el.classList.contains('ok')) return;
  if (matchSel === el) { el.classList.remove('sel'); matchSel = null; return; }
  if (!matchSel || matchSel.__side === el.__side) {
    if (matchSel) matchSel.classList.remove('sel');
    matchSel = el; el.classList.add('sel');
    return;
  }
  const other = matchSel;
  matchSel = null;
  other.classList.remove('sel');
  if (other.__card.id === el.__card.id) {
    other.classList.add('ok'); el.classList.add('ok');
    matchDone++;
    updateMatchScore();
    if (matchDone === MATCH_N) {
      matchRounds++;
      updateMatchScore();
      const r = el.getBoundingClientRect();
      burstConfetti(r.left + r.width / 2, r.top);
      playSparkle();
    }
  } else {
    other.classList.add('bad'); el.classList.add('bad');
    setTimeout(function () {
      other.classList.remove('bad'); el.classList.remove('bad');
    }, 420);
  }
}

/* ── quiz game ───────────────────────────── */
function updateStreak() {
  document.getElementById('streakNow').textContent = streak;
  document.getElementById('streakBest').textContent = bestStreak ? 'שיא: ' + bestStreak : '';
}

function nextQuiz() {
  const body = document.getElementById('quizBody');
  quizLocked = false;
  const pool = uniquePool();
  if (pool.length < QUIZ_OPTS) {
    gameMsg(body, 'צריך לפחות ' + QUIZ_OPTS + ' מילים בסינון הנוכחי כדי לשחק. בחרו עוד שיעורים או נקו את החיפוש.');
    return;
  }
  const correct = pickRandom(pool, 1)[0];
  const others = distractors(pool, correct, QUIZ_OPTS - 1);
  const opts = pickRandom(others.concat([correct]), QUIZ_OPTS);

  body.innerHTML = '';
  const q = document.createElement('div');
  q.className = 'quiz-q';
  const qm = document.createElement('div');
  qm.className = 'q-main';
  qm.textContent = qText(correct);
  q.appendChild(qm);
  const qs = qSub(correct);
  if (qs) {
    const sub = document.createElement('div');
    sub.className = 'q-sub';
    sub.textContent = qs;
    q.appendChild(sub);
  }
  body.appendChild(q);

  const box = document.createElement('div');
  box.className = 'quiz-opts';
  box.id = 'quizOpts';
  let correctBtn = null;
  opts.forEach(function (c) {
    const b = document.createElement('button');
    b.className = 'quiz-opt';
    b.textContent = aText(c);
    if (c.id === correct.id) correctBtn = b;
    b.onclick = function () { quizAnswer(b, c.id === correct.id, correctBtn); };
    box.appendChild(b);
  });
  body.appendChild(box);
}

function quizAnswer(btn, isCorrect, correctBtn) {
  if (quizLocked) return;
  quizLocked = true;
  document.getElementById('quizOpts').classList.add('locked');
  if (isCorrect) {
    btn.classList.add('ok');
    streak++;
    if (streak > bestStreak) { bestStreak = streak; try { localStorage.setItem('fc-best', String(bestStreak)); } catch (e) {} }
    updateStreak();
    playSparkle();
    if (streak % 5 === 0) {
      const r = btn.getBoundingClientRect();
      burstConfetti(r.left + r.width / 2, r.top);
    }
    setTimeout(nextQuiz, 700);
  } else {
    btn.classList.add('bad');
    if (correctBtn) correctBtn.classList.add('ok');
    streak = 0;
    updateStreak();
    setTimeout(nextQuiz, 1700);
  }
}

/* "שיעור 10" -> 10, so chips sort 2,6,7,8,9,10... not lexicographically */
function lessonNum(ls) {
  const m = String(ls).match(/\d+/);
  return m ? parseInt(m[0], 10) : 9999;
}

/* Display name for a lesson. The sheet's `נושא` column wins, so a brand-new
   lesson shows its real topic with no code change or rebuild; LESSON_LABELS
   is only a fallback for rows where that column is empty. */
function lessonName(ls) {
  return lessonTopics[ls] || LESSON_LABELS[ls] || ls;
}

function loadCards(cards, source) {
  ALL = cards;
  lessons = [];
  lessonTopics = {};
  ALL.forEach(function (c) {
    if (lessons.indexOf(c.lesson) === -1) lessons.push(c.lesson);
    if (c.topic && !lessonTopics[c.lesson]) lessonTopics[c.lesson] = c.topic;
  });
  lessons.sort(function (a, b) { return lessonNum(a) - lessonNum(b); });
  enabled = new Set(lessons);
  renderChips();
  rebuild();
  document.getElementById('srcTag').textContent = '· ' + ALL.length + ' מילים';
  document.getElementById('status').textContent = source;
}

/* ── boot ─────────────────────────────────── */
function bootFallback(msg) {
  loadCards(rowsToCards(parseCSV(document.getElementById('fallbackCsv').textContent)), msg);
}

(function boot() {
  /* filters start collapsed so the card is visible without scrolling;
     the choice is remembered once the user opens them */
  let open = false;
  try { open = localStorage.getItem('fc-filters') === '1'; } catch (e) {}
  document.getElementById('filterPanel').classList.toggle('open', open);
  document.getElementById('filterToggle').classList.toggle('open', open);

  sizeTipBorder();
  bootFallback('');
  /* The Arabic web font loads with display=swap, so the very first card
     can be measured/sized against the fallback serif before the real font
     swaps in — re-measure once it's actually active so nothing overflows
     the card that was sized too early. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { requestAnimationFrame(syncCardHeight); });
  }
  if (!SHEET_CSV_URL) return;
  document.getElementById('status').textContent = 'מסנכרן מגוגל שיטס…';
  fetch(SHEET_CSV_URL + (SHEET_CSV_URL.indexOf('?') > -1 ? '&' : '?') + 'cb=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (txt) {
      const cards = rowsToCards(parseCSV(txt));
      if (!cards.length) throw new Error('empty sheet');
      loadCards(cards, 'מסונכרן מגוגל שיטס ✓');
      setTimeout(function () { document.getElementById('status').textContent = ''; }, 2500);
    })
    .catch(function () {
      document.getElementById('status').textContent = 'לא הצלחתי לטעון מגוגל שיטס — מציג גרסה מקומית';
    });
})();

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeTipModal(); return; }
  if (mode !== 'cards') return;                       /* games have their own UI */
  if (e.target && e.target.id === 'searchBox') return; /* don't hijack typing */
  if (e.key === 'ArrowLeft')  move(1);
  if (e.key === 'ArrowRight') move(-1);
  if (e.key === ' ') { e.preventDefault(); flip(); }
});
</script>

const app = initializeApp({"apiKey": "AIzaSyCNGYq4rLwx8h2ffO4n-AxJBlpaW1D1fhs", "authDomain": "danshi-83fe9.firebaseapp.com", "projectId": "danshi-83fe9", "storageBucket": "danshi-83fe9.firebasestorage.app", "messagingSenderId": "811151615732", "appId": "1:811151615732:web:5b0210ad256a35236460a1", "measurementId": "G-Z2RJ53RWYY"});
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;

window.signIn = function () {
  signInWithPopup(auth, provider).catch(function (e) { alert('שגיאת התחברות: ' + e.message); });
};
window.signOutUser = function () { signOut(auth); };

async function loadLevels(uid) {
  const snap = await getDoc(doc(db, 'users', uid));
  levelMap = (snap.exists() && snap.data().levels) || {};
  if (typeof rebuild === 'function') rebuild();
  if (typeof updateChipProgress === 'function') updateChipProgress();
}

/* level: 'partial' | 'good' | null (null clears it). Returns what was applied. */
window.saveLevel = async function (id, level) {
  if (!id) return null;
  if (!currentUser) { window.signIn(); return null; }
  const ref = doc(db, 'users', currentUser.uid);
  if (level) levelMap[id] = level;
  else delete levelMap[id];
  if (typeof show === 'function') show();
  await setDoc(ref, { levels: { [id]: level || deleteField() } }, { merge: true });
  return level;
};

onAuthStateChanged(auth, function (user) {
  currentUser = user;
  const authBtn = document.getElementById('authBtn');
  const userChip = document.getElementById('userChip');
  const authAvatar = document.getElementById('authAvatar');
  const authName = document.getElementById('authName');
  if (user) {
    authBtn.style.display = 'none';
    userChip.style.display = '';
    authAvatar.src = user.photoURL || '';
    authName.textContent = user.displayName || user.email || '';
    loadLevels(user.uid);
  } else {
    authBtn.style.display = '';
    userChip.style.display = 'none';
    authAvatar.style.display = 'none';
    levelMap = {};
    if (typeof rebuild === 'function') rebuild();
    if (typeof updateChipProgress === 'function') updateChipProgress();
  }
});
</script>
