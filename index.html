<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כרטיסיות ערבית</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
  h1 { color: #e94560; margin: 16px 0 12px; font-size: clamp(1.4rem, 5vw, 2rem); }
  .filter { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .filter label { cursor: pointer; padding: 6px 14px; border-radius: 20px; background: #16213e; border: 2px solid #0f3460; user-select: none; font-size: 0.85rem; }
  .filter label:has(input:checked) { border-color: #e94560; color: #e94560; }
  .filter input[type=checkbox] { display: none; }
  .dir-toggle { margin-bottom: 14px; display: flex; gap: 8px; }
  .dir-toggle button { background: #0f3460; color: #aaa; font-size: 0.85rem; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; }
  .dir-toggle button.active { background: #e94560; color: white; }

  .card-wrap { perspective: 1000px; width: min(92vw, 420px); min-height: 260px; cursor: pointer; }
  .card-inner { position: relative; width: 100%; min-height: 260px; transition: transform 0.45s; transform-style: preserve-3d; }
  .card-wrap.flipped .card-inner { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; min-height: 260px; backface-visibility: hidden; background: #16213e; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 28px 20px; box-shadow: 0 8px 32px #0006; }
  .card-back { transform: rotateY(180deg); }

  .lesson-tag { font-size: 0.72rem; color: #555; position: absolute; top: 14px; right: 18px; }
  .arabic-script { font-size: clamp(1rem, 4vw, 1.3rem); color: #888; direction: rtl; text-align: center; line-height: 1.4; }
  .transliteration { font-size: clamp(2rem, 7vw, 2.8rem); color: #e94560; text-align: center; line-height: 1.3; }
  .hebrew-text { font-size: clamp(1.5rem, 6vw, 2.2rem); color: #a8dadc; text-align: center; }
  .hint { font-size: 0.8rem; color: #444; position: absolute; bottom: 14px; }

  .sound-btn { position: absolute; bottom: 14px; left: 18px; background: none; border: none; cursor: pointer; font-size: 1.4rem; color: #555; padding: 4px; line-height: 1; }
  .sound-btn:hover { color: #e94560; }

  .controls { margin-top: 16px; display: flex; gap: 10px; }
  button.nav { padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; }
  .btn-next { background: #e94560; color: white; }
  .btn-prev { background: #0f3460; color: white; }
  .btn-shuffle { background: #333; color: white; }
  .progress { margin-top: 12px; color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>🃏 כרטיסיות ערבית</h1>

<div class="filter">
  <label><input type="checkbox" data-lesson="שיעור 9" checked onchange="rebuild()"><span>שיעור 9 – כינויי כבוד</span></label>
  <label><input type="checkbox" data-lesson="שיעור 10" checked onchange="rebuild()"><span>שיעור 10 – ניהול שיחה</span></label>
  <label><input type="checkbox" data-lesson="שיעור 11" checked onchange="rebuild()"><span>שיעור 11 – מצבי רוח</span></label>
  <label><input type="checkbox" data-lesson="שיעור 12" checked onchange="rebuild()"><span>שיעור 12 – מילות שאלה</span></label>
  <label><input type="checkbox" data-lesson="שיעור 13" checked onchange="rebuild()"><span>שיעור 13 – הצגה עצמית</span></label>
</div>

<div class="dir-toggle">
  <button id="btnAH" class="active" onclick="setDir('ah')">ערבית ← עברית</button>
  <button id="btnHA" onclick="setDir('ha')">עברית ← ערבית</button>
</div>

<div class="card-wrap" id="cardWrap" onclick="flip()">
  <div class="card-inner" id="cardInner">
    <div class="card-face card-front">
      <span class="lesson-tag" id="lesson"></span>
      <div class="arabic-script" id="front"></div>
      <div class="transliteration" id="translit"></div>
      <button class="sound-btn" id="soundBtn" onclick="event.stopPropagation(); speak()" title="השמע">🔊</button>
      <span class="hint" id="hintFront">לחץ לגלות</span>
    </div>
    <div class="card-face card-back">
      <div class="hebrew-text" id="back"></div>
      <button class="sound-btn" id="soundBtnBack" onclick="event.stopPropagation(); speakBack()" title="השמע">🔊</button>
    </div>
  </div>
</div>

<div class="controls">
  <button class="nav btn-prev" onclick="move(-1)">◀ קודם</button>
  <button class="nav btn-shuffle" onclick="shuffle()">🔀 ערבב</button>
  <button class="nav btn-next" onclick="move(1)">הבא ▶</button>
</div>
<div class="progress" id="progress"></div>

];

let deck = [], idx = 0, dir = 'ah';

function rebuild() {
  const checked = [...document.querySelectorAll('.filter input[type=checkbox]:checked')].map(el => el.dataset.lesson);
  deck = ALL.filter(c => checked.includes(c.lesson));
  shuffle();
}

function setDir(d) {
  dir = d;
  document.getElementById('btnAH').classList.toggle('active', d==='ah');
  document.getElementById('btnHA').classList.toggle('active', d==='ha');
  show();
}

function shuffle() {
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  idx=0; show();
}

function flip() {
  document.getElementById('cardWrap').classList.toggle('flipped');
}

function show() {
  if(!deck.length) return;
  const c = deck[idx];
  document.getElementById('cardWrap').classList.remove('flipped');
  document.getElementById('lesson').textContent = c.lesson;
  if(dir==='ah'){
    document.getElementById('front').textContent = c.arabic;
    document.getElementById('translit').textContent = c.ar;
    document.getElementById('back').textContent = c.he;
    document.getElementById('soundBtn').style.display = 'block';
    document.getElementById('soundBtnBack').style.display = 'none';
  } else {
    document.getElementById('front').textContent = c.he;
    document.getElementById('translit').textContent = '';
    document.getElementById('back').textContent = c.arabic;
    document.getElementById('soundBtn').style.display = 'none';
    document.getElementById('soundBtnBack').style.display = 'block';
  }
  document.getElementById('progress').textContent = `${idx+1} / ${deck.length}`;
}

function move(n) {
  idx = (idx+n+deck.length)%deck.length;
  show();
}

function speak() {
  const text = deck[idx].arabic;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function speakBack() {
  const text = deck[idx].arabic;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

rebuild();
</script>
</body>
</html>
