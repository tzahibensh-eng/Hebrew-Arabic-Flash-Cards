<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>כרטיסיות ערבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #f4f4f5;
  --bg-soft:   #ebebed;
  --surface:   #fffefc;
  --surface-2: #ffffff;
  --border:    #e4e4e7;
  --border-2:  #d4d4d8;
  --text:      #18181b;
  --text-2:    #52525b;
  --muted:     #a1a1aa;
  --accent:    #4f46e5;
  --accent-2:  #6366f1;
  --accent-sf: #eef2ff;
  --emerald:   #059669;
  --rose:      #e11d48;
  --shadow-1:  0 1px 2px rgba(24,24,27,.04), 0 4px 12px rgba(24,24,27,.05), 0 16px 40px rgba(24,24,27,.06);
  --shadow-2:  0 2px 4px rgba(24,24,27,.05), 0 8px 20px rgba(24,24,27,.07), 0 24px 60px rgba(79,70,229,.10);
  --ease:      cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"] {
  --bg:        #0b0b0f;
  --bg-soft:   #131318;
  --surface:   #17171d;
  --surface-2: #1d1d25;
  --border:    #27272f;
  --border-2:  #35353f;
  --text:      #f4f4f5;
  --text-2:    #a1a1aa;
  --muted:     #6b6b76;
  --accent:    #818cf8;
  --accent-2:  #a5b4fc;
  --accent-sf: #1e1b3a;
  --emerald:   #34d399;
  --rose:      #fb7185;
  --shadow-1:  0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-2:  0 2px 6px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.4), 0 24px 60px rgba(129,140,248,.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { overflow-x: hidden; max-width: 100vw; }

body {
  font-family: 'Heebo','Inter',system-ui,-apple-system,sans-serif;
  font-size: 16px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: env(safe-area-inset-top) calc(16px + env(safe-area-inset-right))
           calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  transition: background .3s var(--ease), color .3s var(--ease);
  -webkit-font-smoothing: antialiased;
}

button, .chip, .segmented button {
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ── progress ─────────────────────────────── */
.progress-track {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: var(--border); z-index: 50;
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .35s var(--ease);
}

/* ── header ───────────────────────────────── */
header {
  width: 100%; max-width: 520px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 2px 16px;
}
.brand { font-size: .95rem; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
.brand span { color: var(--muted); font-weight: 400; }

.icon-btn {
  width: 44px; height: 44px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); cursor: pointer; font-size: .95rem;
  display: grid; place-items: center;
  transition: all .18s var(--ease);
}
.icon-btn:hover  { border-color: var(--border-2); color: var(--text); }
.icon-btn:active { transform: translateY(2px); }

.google-btn {
  display: flex; align-items: center; gap: 7px;
  height: 44px; padding: 0 14px;
  border-radius: 8px; border: 1px solid #dadce0; background: #fff;
  color: #3c4043; font-family: 'Inter', 'Heebo', system-ui, sans-serif;
  font-size: .78rem; font-weight: 500; letter-spacing: 0; white-space: nowrap;
  cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  transition: all .18s var(--ease);
}
.google-btn:hover  { box-shadow: 0 1px 4px rgba(0,0,0,.18); border-color: #c6c9cc; }
.google-btn:active { transform: translateY(2px); }
.google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

.user-chip {
  display: flex; align-items: center; gap: 8px;
  height: 44px; max-width: 170px; padding: 0 14px 0 4px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: .78rem; font-weight: 500;
  cursor: pointer; transition: all .18s var(--ease);
}
.user-chip:hover  { border-color: var(--accent); }
.user-chip:active { transform: translateY(2px); }
.user-chip img {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
}
.user-chip span {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── controls ─────────────────────────────── */
.controls { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chip {
  min-height: 44px;
  font-size: .72rem; font-weight: 500; line-height: 1.35;
  padding: 8px 6px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); cursor: pointer;
  text-align: center; display: flex; align-items: center; justify-content: center;
  transition: all .18s var(--ease);
}
.chip:active { transform: translateY(2px); }
.chip.on {
  background: var(--accent-sf); border-color: var(--accent);
  color: var(--accent); font-weight: 600;
}

.segmented {
  display: flex; padding: 3px; gap: 3px;
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 12px;
}
.segmented button {
  flex: 1; min-height: 44px; padding: 8px 10px; font-size: .8rem; font-weight: 500;
  font-family: inherit; border: none; border-radius: 9px;
  background: transparent; color: var(--text-2); cursor: pointer;
  transition: all .2s var(--ease);
}
.segmented button:active { transform: translateY(2px); }
.segmented button.on {
  background: var(--surface-2); color: var(--text);
  font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

/* ── card ─────────────────────────────────── */
.card-wrap {
  position: relative;
  perspective: 1600px;
  width: 100%; max-width: 520px; min-height: 340px;
  cursor: pointer; margin-bottom: 4px;
}
.card-inner {
  position: relative; width: 100%; min-height: 340px;
  transform-style: preserve-3d;
  transition: transform .6s var(--ease);
}
.card-wrap.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0; width: 100%; min-height: 340px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  padding: 46px 26px 52px;
  transition: box-shadow .28s var(--ease), border-color .28s var(--ease);
}
.card-wrap:hover .card-face {
  box-shadow: var(--shadow-2);
  border-color: var(--accent);
}
.card-back { transform: rotateY(180deg); }

.lesson-tag {
  position: absolute; top: 16px; right: 20px;
  font-size: .68rem; font-weight: 500; letter-spacing: .01em;
  color: var(--muted);
}
.badge {
  position: absolute; top: 15px; left: 20px;
  font-size: .62rem; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--emerald) 12%, transparent);
  color: var(--emerald);
}
.hint {
  position: absolute; bottom: 17px; left: 0; right: 0;
  text-align: center; font-size: .7rem; color: var(--muted);
  opacity: .8;
}
.know-btn {
  position: absolute; bottom: 10px; left: 14px; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: 11px 18px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); cursor: pointer;
  font-family: inherit; font-size: .78rem; font-weight: 500;
  transition: all .18s var(--ease);
}
.know-btn:hover  { border-color: var(--emerald); color: var(--emerald); }
.know-btn:active { transform: translateY(2px); }
.know-btn .chk { font-size: .85rem; line-height: 1; }
.know-btn.on {
  background: var(--emerald); border-color: var(--emerald);
  color: #fff; font-weight: 600;
  box-shadow: 0 1px 2px rgba(5,150,105,.25), 0 6px 16px rgba(5,150,105,.25);
}

.transliteration {
  font-size: clamp(1.75rem, 7vw, 2.6rem); font-weight: 600;
  letter-spacing: -.02em; line-height: 1.25;
  color: var(--text); text-align: center;
}
.arabic-script {
  font-family: 'Noto Naskh Arabic', serif;
  font-size: clamp(1.1rem, 4.4vw, 1.55rem); font-weight: 400;
  direction: rtl; line-height: 2; color: var(--text-2); text-align: center;
}
.hebrew-text {
  font-size: clamp(1.45rem, 6vw, 2.1rem); font-weight: 500;
  letter-spacing: -.015em; line-height: 1.45;
  color: var(--text); text-align: center;
}
.note {
  margin-top: 4px; max-width: 90%;
  font-size: .78rem; font-weight: 300; line-height: 1.6;
  color: var(--muted); text-align: center;
  padding-top: 12px; border-top: 1px solid var(--border);
}

.sound-btn {
  margin-top: 6px;
  width: 44px; height: 44px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); cursor: pointer; font-size: 1.05rem;
  display: grid; place-items: center;
  transition: all .18s var(--ease);
}
.sound-btn:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-sf); }
.sound-btn:active { transform: translateY(2px); }

/* gender pair */
.gender-pair { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.gender-row  { display: flex; align-items: center; gap: 12px; padding: 8px 2px; }
.gender-label {
  font-size: .62rem; font-weight: 600; letter-spacing: .04em;
  color: var(--muted); min-width: 40px; text-align: center; flex-shrink: 0;
  padding: 3px 0; border-radius: 6px; background: var(--bg-soft);
}
.word-block { flex: 1; text-align: center; min-width: 0; }
.word-block .transliteration { font-size: clamp(1.35rem, 5.4vw, 1.95rem); }
.word-block .arabic-script  { font-size: clamp(.95rem, 3.6vw, 1.25rem); line-height: 1.85; }
.gender-divider { height: 1px; background: var(--border); margin: 2px 8px; }
.sound-btn-sm {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); cursor: pointer; font-size: .9rem;
  display: grid; place-items: center;
  transition: all .18s var(--ease);
}
.sound-btn-sm:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-sf); }
.sound-btn-sm:active { transform: translateY(2px); }

/* ── nav ──────────────────────────────────── */
.nav-row {
  width: 100%; max-width: 520px;
  display: flex; gap: 8px; margin-top: 18px;
}
.nav-btn {
  flex: 1; padding: 13px 10px;
  font-family: inherit; font-size: .88rem; font-weight: 500;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer;
  transition: all .18s var(--ease);
}
.nav-btn:hover  { border-color: var(--border-2); color: var(--text); }
.nav-btn:active { transform: translateY(2px); }
.nav-btn.primary {
  flex: 1.4;
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  box-shadow: 0 1px 2px rgba(79,70,229,.2), 0 6px 16px rgba(79,70,229,.22);
}
.nav-btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

.counter {
  margin-top: 14px; font-size: .74rem; font-weight: 400;
  color: var(--muted); letter-spacing: .02em;
}
.status { margin-top: 8px; font-size: .7rem; color: var(--muted); min-height: 1em; }

.empty { color: var(--muted); font-size: .9rem; text-align: center; }

.filter-label { font-size: .7rem; color: var(--muted); margin: 2px 2px -2px; }

.credit {
  margin-top: 26px; font-size: .72rem; color: var(--muted);
  text-align: center;
}
.credit a {
  color: var(--muted); text-decoration: underline; text-underline-offset: 2px;
  transition: color .18s var(--ease);
}
.credit a:hover { color: var(--accent); }

.confetti-piece {
  position: fixed; top: 0; left: 0; width: 8px; height: 8px; border-radius: 2px;
  pointer-events: none; z-index: 999;
  animation: confetti-rise 950ms ease-out forwards;
}
@keyframes confetti-rise {
  0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--dx, 0px), -300px) rotate(560deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<header>
  <div class="brand">כרטיסיות ערבית <span id="srcTag"></span></div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="google-btn" id="authBtn" onclick="signIn()">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.3 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 45c5.4 0 10.3-2.1 14-5.5l-6.5-5.3C29.6 35.7 26.9 36.5 24 36.5c-5.4 0-9.9-3.3-11.5-7.9l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.9-3.2 5.3-6.1 6.7l6.5 5.3C39.9 37 44 31.4 44 24c0-1.4-.1-2.7-.4-3.5z"/>
      </svg>
      <span>התחברות עם Google</span>
    </button>
    <button class="user-chip" id="userChip" style="display:none" onclick="signOutUser()" title="לחצו להתנתקות">
      <img id="authAvatar" alt="">
      <span id="authName"></span>
    </button>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="מצב תצוגה">◐</button>
  </div>
</header>

<div class="controls">
  <div class="chips" id="chips"></div>
  <div class="segmented">
    <button id="btnAH" class="on" onclick="setDir('ah')">ערבית ← עברית</button>
    <button id="btnHA" onclick="setDir('ha')">עברית ← ערבית</button>
  </div>
  <div class="filter-label">נאמר בשיעור</div>
  <div class="segmented" id="saidSeg">
    <button class="on" data-v="all" onclick="setSaidFilter('all')">הכל</button>
    <button data-v="said" onclick="setSaidFilter('said')">נאמרו</button>
    <button data-v="not" onclick="setSaidFilter('not')">לא נאמרו</button>
  </div>
  <div class="filter-label">מילים שאני זוכר/ת</div>
  <div class="segmented" id="knownSeg">
    <button class="on" data-v="all" onclick="setKnownFilter('all')">הכל</button>
    <button data-v="known" onclick="setKnownFilter('known')">זכורות</button>
    <button data-v="not" onclick="setKnownFilter('not')">לא זכורות</button>
  </div>
</div>

<div class="card-wrap" id="cardWrap" onclick="flip()">
  <div class="card-inner" id="cardInner">
    <div class="card-face" id="cardFront">
      <span class="lesson-tag" id="lessonTag"></span>
      <span class="badge" id="badgeEl" style="display:none">נאמר בשיעור</span>
      <div id="frontContent"></div>
      <span class="hint">לחצו לגילוי</span>
    </div>
    <div class="card-face card-back" id="cardBack">
      <div id="backContent"></div>
    </div>
  </div>
  <button class="know-btn" id="knowBtn" aria-label="סמן כזכור" onclick="event.stopPropagation();markKnown()">
    <span class="chk">✓</span><span>זוכר</span>
  </button>
</div>

<div class="nav-row">
  <button class="nav-btn" onclick="event.stopPropagation();move(-1)">קודם</button>
  <button class="nav-btn" onclick="event.stopPropagation();shuffle()">ערבב</button>
  <button class="nav-btn primary" onclick="event.stopPropagation();move(1)">הבא</button>
</div>
<div class="counter" id="counter"></div>
<div class="status" id="status"></div>
<div class="credit">נבנה על ידי <a href="https://www.linkedin.com/in/tzahi-ben-shimol-411111197/" target="_blank" rel="noopener noreferrer">צחי בן שימול</a></div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRS4HF5B78cLsLE-lzAuJoCfImLasfQGLvo9TXPWNhCpwLW9uqgEtwmhMXh8cdUAqpvblg8pQhas3MG/pub?output=csv";
const LESSON_LABELS = {
  "שיעור 9": "שיעור 9 – כינויי כבוד",
  "שיעור 10": "שיעור 10 – ניהול שיחה",
  "שיעור 11": "שיעור 11 – מצבי רוח",
  "שיעור 12": "שיעור 12 – מילות שאלה",
  "שיעור 13": "שיעור 13 – הצגה עצמית"
};

let ALL = [], deck = [], idx = 0, dir = 'ah', lessons = [], enabled = new Set();
let saidFilter = 'all', knownFilter = 'all';
var knownIds = new Set();

/* ── theme ────────────────────────────────── */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('fc-theme', t); } catch (e) {}
  document.querySelector('meta[name=theme-color]').setAttribute(
    'content', t === 'dark' ? '#0b0b0f' : '#f4f4f5');
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
(function () {
  let t = null;
  try { t = localStorage.getItem('fc-theme'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(t);
})();

/* ── CSV parsing ──────────────────────────── */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', q = false;
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return c.trim(); }); });
}

function rowsToCards(rows) {
  if (!rows.length) return [];
  const head = rows[0].map(function (h) { return h.replace(/^\uFEFF/, '').trim(); });
  const col = {};
  head.forEach(function (h, i) { col[h] = i; });
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const g = function (name) { const i = col[name]; return i === undefined ? '' : (rows[r][i] || '').trim(); };
    const tr = g('תעתיק'), he = g('תרגום'), ar = g('ערבית');
    if (!tr && !ar) continue;
    const said = g('נאמר_בשיעור') === 'כן';
    const note = g('הערות');
    const lesson = g('שיעור');
    const wordCount = he.split(/\s+/).filter(Boolean).length;
    const isPair = (tr.split('/').length - 1) === 1 && (ar.split('/').length - 1) === 1;
    const id = lesson + '|' + tr;
    if (isPair) {
      const t = tr.split('/'), a = ar.split('/');
      out.push({ id: id, isGenderPair: true, arM: t[0].trim(), arF: t[1].trim(),
                 arabicM: a[0].trim(), arabicF: a[1].trim(),
                 he: he, note: note, said: said, lesson: lesson, wordCount: wordCount });
    } else {
      out.push({ id: id, isGenderPair: false, ar: tr, arabic: ar,
                 he: he, note: note, said: said, lesson: lesson, wordCount: wordCount });
    }
  }
  return out;
}

/* ── speech ───────────────────────────────── */
function speakText(text) {
  if (!text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA'; u.rate = 0.8;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ── rendering ────────────────────────────── */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function genderHTML(c) {
  function rowHTML(label, tr, ab, key) {
    return '<div class="gender-row">' +
      '<span class="gender-label">' + label + '</span>' +
      '<div class="word-block">' +
        '<div class="transliteration">' + esc(tr) + '</div>' +
        '<div class="arabic-script">' + esc(ab) + '</div>' +
      '</div>' +
      '<button class="sound-btn-sm" aria-label="השמעה" ' +
        'onclick="event.stopPropagation();speakText(deck[idx].' + key + ')">🔊</button>' +
    '</div>';
  }
  return '<div class="gender-pair">' +
    rowHTML('זכר', c.arM, c.arabicM, 'arabicM') +
    '<div class="gender-divider"></div>' +
    rowHTML('נקבה', c.arF, c.arabicF, 'arabicF') +
  '</div>';
}

function arabicHTML(c) {
  return '<div class="transliteration">' + esc(c.ar) + '</div>' +
         '<div class="arabic-script">' + esc(c.arabic) + '</div>' +
         '<button class="sound-btn" aria-label="השמעה" ' +
           'onclick="event.stopPropagation();speakText(deck[idx].arabic)">🔊</button>';
}

function hebrewHTML(c) {
  return '<div class="hebrew-text">' + esc(c.he) + '</div>' +
         (c.note ? '<div class="note">' + esc(c.note) + '</div>' : '');
}

function show() {
  const fc = document.getElementById('frontContent');
  const bc = document.getElementById('backContent');
  const wrap = document.getElementById('cardWrap');
  wrap.classList.remove('flipped');

  if (!deck.length) {
    document.getElementById('lessonTag').textContent = '';
    document.getElementById('badgeEl').style.display = 'none';
    fc.innerHTML = '<div class="empty">אין כרטיסיות בסינון הנוכחי</div>';
    bc.innerHTML = '';
    document.getElementById('counter').textContent = '0 / 0';
    document.getElementById('progressFill').style.width = '0%';
    return;
  }

  const c = deck[idx];
  document.getElementById('lessonTag').textContent = LESSON_LABELS[c.lesson] || c.lesson;
  document.getElementById('badgeEl').style.display = c.said ? '' : 'none';
  const isKnown = knownIds.has(c.id);
  const kb = document.getElementById('knowBtn');
  kb.classList.toggle('on', isKnown);
  kb.querySelector('.chk').textContent = isKnown ? '🎉' : '✓';

  const arSide = c.isGenderPair ? genderHTML(c) : arabicHTML(c);
  if (dir === 'ah') { fc.innerHTML = arSide;      bc.innerHTML = hebrewHTML(c); }
  else              { fc.innerHTML = hebrewHTML(c); bc.innerHTML = arSide; }

  requestAnimationFrame(function () {
    ['cardInner', 'cardWrap'].forEach(function (id) {
      document.getElementById(id).style.minHeight = '';
    });
    document.querySelectorAll('.card-face').forEach(function (f) { f.style.minHeight = ''; });
    const h = Math.max(
      document.getElementById('cardFront').scrollHeight,
      document.getElementById('cardBack').scrollHeight, 340) + 'px';
    document.getElementById('cardInner').style.minHeight = h;
    document.getElementById('cardWrap').style.minHeight = h;
    document.querySelectorAll('.card-face').forEach(function (f) { f.style.minHeight = h; });
  });

  document.getElementById('counter').textContent = (idx + 1) + ' / ' + deck.length;
  document.getElementById('progressFill').style.width =
    ((idx + 1) / deck.length * 100).toFixed(1) + '%';
}

function flip()  { document.getElementById('cardWrap').classList.toggle('flipped'); }
function move(n) { if (!deck.length) return; idx = (idx + n + deck.length) % deck.length; show(); }

function playSparkle() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [1400, 1760, 2093, 2637].forEach(function (freq, i) {
      const t = ctx.currentTime + i * 0.045;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.1, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    });
    setTimeout(function () { ctx.close(); }, 500);
  } catch (e) {}
}

function burstConfetti(x, y) {
  const colors = ['#4f46e5', '#6366f1', '#059669', '#e11d48', '#f59e0b'];
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('span');
    el.className = 'confetti-piece';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = (Math.random() * 100) + 'ms';
    el.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1300);
  }
}

async function markKnown() {
  if (!deck.length || typeof toggleKnown !== 'function') return;
  const nowKnown = await toggleKnown(deck[idx].id);
  if (nowKnown === true) {
    const rect = document.getElementById('knowBtn').getBoundingClientRect();
    burstConfetti(rect.left + rect.width / 2, rect.top);
    playSparkle();
    setTimeout(function () { move(1); }, 480);
  }
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }
  idx = 0; show();
}

function setDir(d) {
  dir = d;
  document.getElementById('btnAH').classList.toggle('on', d === 'ah');
  document.getElementById('btnHA').classList.toggle('on', d === 'ha');
  show();
}

function renderChips() {
  const box = document.getElementById('chips');
  box.innerHTML = '';
  lessons.forEach(function (ls) {
    const el = document.createElement('label');
    el.className = 'chip on';
    el.textContent = LESSON_LABELS[ls] || ls;
    el.onclick = function () {
      if (enabled.has(ls)) { enabled.delete(ls); el.classList.remove('on'); }
      else { enabled.add(ls); el.classList.add('on'); }
      rebuild();
    };
    box.appendChild(el);
  });
}

function setSaidFilter(v) {
  saidFilter = v;
  document.querySelectorAll('#saidSeg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  rebuild();
}

function setKnownFilter(v) {
  knownFilter = v;
  document.querySelectorAll('#knownSeg button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  rebuild();
}

function rebuild() {
  deck = ALL.filter(function (c) {
    if (!enabled.has(c.lesson)) return false;
    if (saidFilter === 'said' && !c.said) return false;
    if (saidFilter === 'not'  && c.said) return false;
    const known = knownIds.has(c.id);
    if (knownFilter === 'known' && !known) return false;
    if (knownFilter === 'not'   && known) return false;
    return true;
  });
  shuffle();
}

function loadCards(cards, source) {
  ALL = cards;
  lessons = [];
  ALL.forEach(function (c) { if (lessons.indexOf(c.lesson) === -1) lessons.push(c.lesson); });
  enabled = new Set(lessons);
  renderChips();
  rebuild();
  document.getElementById('srcTag').textContent = '· ' + ALL.length + ' מילים';
  document.getElementById('status').textContent = source;
}

/* ── boot ─────────────────────────────────── */
function bootFallback(msg) {
  loadCards(rowsToCards(parseCSV(document.getElementById('fallbackCsv').textContent)), msg);
}

(function boot() {
  bootFallback('');
  if (!SHEET_CSV_URL) return;
  document.getElementById('status').textContent = 'מסנכרן מגוגל שיטס…';
  fetch(SHEET_CSV_URL + (SHEET_CSV_URL.indexOf('?') > -1 ? '&' : '?') + 'cb=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (txt) {
      const cards = rowsToCards(parseCSV(txt));
      if (!cards.length) throw new Error('empty sheet');
      loadCards(cards, 'מסונכרן מגוגל שיטס ✓');
      setTimeout(function () { document.getElementById('status').textContent = ''; }, 2500);
    })
    .catch(function () {
      document.getElementById('status').textContent = 'לא הצלחתי לטעון מגוגל שיטס — מציג גרסה מקומית';
    });
})();

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft')  move(1);
  if (e.key === 'ArrowRight') move(-1);
  if (e.key === ' ') { e.preventDefault(); flip(); }
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, arrayUnion, arrayRemove }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({"apiKey": "AIzaSyCNGYq4rLwx8h2ffO4n-AxJBlpaW1D1fhs", "authDomain": "danshi-83fe9.firebaseapp.com", "projectId": "danshi-83fe9", "storageBucket": "danshi-83fe9.firebasestorage.app", "messagingSenderId": "811151615732", "appId": "1:811151615732:web:5b0210ad256a35236460a1", "measurementId": "G-Z2RJ53RWYY"});
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;

window.signIn = function () {
  signInWithPopup(auth, provider).catch(function (e) { alert('שגיאת התחברות: ' + e.message); });
};
window.signOutUser = function () { signOut(auth); };

async function loadKnown(uid) {
  const snap = await getDoc(doc(db, 'users', uid));
  knownIds = new Set(snap.exists() ? (snap.data().known || []) : []);
  if (typeof rebuild === 'function') rebuild();
  if (typeof show === 'function') show();
}

window.toggleKnown = async function (id) {
  if (!id) return null;
  if (!currentUser) { window.signIn(); return null; }
  const ref = doc(db, 'users', currentUser.uid);
  let nowKnown;
  if (knownIds.has(id)) {
    knownIds.delete(id);
    nowKnown = false;
    await setDoc(ref, { known: arrayRemove(id) }, { merge: true });
  } else {
    knownIds.add(id);
    nowKnown = true;
    await setDoc(ref, { known: arrayUnion(id) }, { merge: true });
  }
  if (typeof show === 'function') show();
  return nowKnown;
};

onAuthStateChanged(auth, function (user) {
  currentUser = user;
  const authBtn = document.getElementById('authBtn');
  const userChip = document.getElementById('userChip');
  const authAvatar = document.getElementById('authAvatar');
  const authName = document.getElementById('authName');
  if (user) {
    authBtn.style.display = 'none';
    userChip.style.display = '';
    authAvatar.src = user.photoURL || '';
    authName.textContent = user.displayName || user.email || '';
    loadKnown(user.uid);
  } else {
    authBtn.style.display = '';
    userChip.style.display = 'none';
    authAvatar.style.display = 'none';
    knownIds = new Set();
    if (typeof rebuild === 'function') rebuild();
    if (typeof show === 'function') show();
  }
});
</script>
